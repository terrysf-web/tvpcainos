<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Worship · 팀 선택</title>
<meta name="description" content="TVPC 찬양팀 앱 — 팀을 선택하세요" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root{
    --grad: linear-gradient(160deg,#150f52 0%,#241a7d 42%,#4a3bc4 78%,#6b5de7 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    min-height:100dvh;
    background:var(--grad);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 48px) 22px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:34px;text-align:center;}
  .brand .mark{
    font-size:13px;font-weight:900;letter-spacing:.32em;
    color:rgba(255,255,255,.62);text-transform:uppercase;
  }
  .brand h1{
    margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.15;
  }
  .brand p{margin:4px 0 0;font-size:13.5px;color:rgba(255,255,255,.66);font-weight:600;}

  .cards{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;}
  .card{
    display:flex;align-items:center;gap:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    border-radius:20px;
    padding:18px 18px;
    color:#fff;text-decoration:none;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
    backdrop-filter:blur(6px);
  }
  .card:active{transform:scale(.985);background:rgba(255,255,255,.12);}
  @media(hover:hover){.card:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.32);}}
  .card .badge{
    width:54px;height:54px;flex-shrink:0;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:900;letter-spacing:-.02em;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
  }
  .card .txt{flex:1;min-width:0;}
  .card .name{font-size:19px;font-weight:900;letter-spacing:-.01em;line-height:1.2;}
  .card .sub{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:3px;font-weight:600;}
  .card .arrow{font-size:22px;color:rgba(255,255,255,.5);flex-shrink:0;}

  .remember{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin-top:22px;font-size:13px;color:rgba(255,255,255,.72);font-weight:600;
    cursor:pointer;user-select:none;
  }
  .remember input{width:17px;height:17px;accent-color:#8b7dff;cursor:pointer;}

  .foot{margin-top:auto;padding-top:34px;font-size:11.5px;color:rgba(255,255,255,.4);text-align:center;}
  .foot a{color:rgba(255,255,255,.55);text-decoration:none;}

  /* 자동 이동 오버레이 */
  #auto{
    position:fixed;inset:0;background:var(--grad);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    z-index:10;text-align:center;padding:24px;
  }
  #auto.on{display:flex;}
  #auto .spin{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.25);border-top-color:#fff;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg);}}
  #auto .msg{font-size:15px;font-weight:700;color:rgba(255,255,255,.9);}
  #auto button{
    margin-top:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
    color:#fff;font-size:13px;font-weight:800;font-family:inherit;
    padding:9px 18px;border-radius:12px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">TVPC · Worship</div>
    <h1>어느 팀으로<br/>들어가시겠어요?</h1>
    <p>팀을 선택하면 해당 앱으로 이동합니다</p>
  </div>

  <div class="cards">
    <a class="card" href="https://tvpcainos.web.app" data-team="ainos">
      <div class="badge" style="background:linear-gradient(135deg,#6b5de7,#8b7dff);">A</div>
      <div class="txt">
        <div class="name">아이노스</div>
        <div class="sub">주일 2부예배 찬양팀 · Ainos</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card" href="https://anamnesisworship.web.app" data-team="anamnesis">
      <div class="badge" style="background:linear-gradient(135deg,#c8912f,#e0b45a);color:#2a1c04;">✝</div>
      <div class="txt">
        <div class="name">아남네시스</div>
        <div class="sub">성찬주일 찬양팀 · Anamnesis</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <label class="remember">
    <input type="checkbox" id="remember" checked />
    이 팀 기억하기 (다음부턴 바로 이동)
  </label>

  <div class="foot">
    worship.tvpc.church<br/>
    <a href="?choose=1" id="reset">다른 팀 선택 초기화</a>
  </div>

  <!-- 자동 이동 화면 -->
  <div id="auto">
    <div class="spin"></div>
    <div class="msg" id="autoMsg">이동 중…</div>
    <button id="stay">여기 머무르기 / 팀 바꾸기</button>
  </div>

<script>
(function(){
  var KEY = "tvpc_worship_team";
  var URLS = {
    ainos:     "https://tvpcainos.web.app",
    anamnesis: "https://anamnesisworship.web.app"
  };
  var NAMES = { ainos:"아이노스", anamnesis:"아남네시스" };

  var params = new URLSearchParams(location.search);
  var forceChoose = params.has("choose");
  var remember = document.getElementById("remember");

  // "다른 팀 선택 초기화" → 저장 지우고 선택 화면
  document.getElementById("reset").addEventListener("click", function(e){
    e.preventDefault();
    try{ localStorage.removeItem(KEY); }catch(_){}
    location.href = location.pathname + "?choose=1";
  });

  // 저장된 팀이 있으면 자동 이동(단, ?choose 로 들어오면 무시)
  var saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(_){}
  if(saved && URLS[saved] && !forceChoose){
    var auto = document.getElementById("auto");
    document.getElementById("autoMsg").textContent = NAMES[saved] + " 앱으로 이동 중…";
    auto.classList.add("on");
    var t = setTimeout(function(){ location.replace(URLS[saved]); }, 900);
    document.getElementById("stay").addEventListener("click", function(){
      clearTimeout(t);
      try{ localStorage.removeItem(KEY); }catch(_){}
      auto.classList.remove("on");
    });
  }

  // 카드 클릭 → (기억 체크 시) 저장 후 이동
  var cards = document.querySelectorAll(".card");
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener("click", function(e){
      var team = this.getAttribute("data-team");
      if(remember && remember.checked){
        try{ localStorage.setItem(KEY, team); }catch(_){}
      } else {
        try{ localStorage.removeItem(KEY); }catch(_){}
      }
      // 기본 링크 이동 그대로 진행
    });
  }
})();
</script>
</body>
</html>
